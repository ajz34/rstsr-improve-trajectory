[package]
name = "reductions"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

# T2' of the rstsr CPU-efficiency campaign: value reductions
# (sum/min/max/mean/var/norm + sum_axes/axis reductions) in
# rstsr-native-impl/src/cpu_{serial,rayon}/reduction.rs and their wiring
# closures in rstsr-core.
#
# PHASE 1 = baseline + anatomy + design (PLAN.md). NO code changes to rstsr.
# Path-depends on the local rstsr checkout at 386948be, mirroring
# rstsr-core's default features EXPLICITLY (T0 harness pattern).

[dependencies]
rstsr-core = { path = "../../rstsr/rstsr-core", default-features = false, features = [
    "row_major",
    "aligned_alloc",
    "faer",
    "faer_as_default",
] }
# direct dep for the layout-branch probe (public layout machinery)
rstsr-common = { path = "../../rstsr/rstsr-common", default-features = false, features = [
    "row_major",
    "aligned_alloc",
] }
# criterion is a regular dependency because the harness lib exposes
# `configure_group`; this is a bench-only crate, nothing ships from it.
criterion = { version = "0.5", features = ["cargo_bench_support"] }

[dev-dependencies]
ndarray = "0.16"

# Criterion suites (release mode via `cargo bench`; profile is stock cargo
# release: opt-level 3, no LTO — this is what we want to baseline).
[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "anchors_ndarray"
harness = false

[profile.release]
# stock cargo release defaults; stated explicitly for the README
opt-level = 3
debug = false
lto = false
codegen-units = 16
panic = "unwind"
